[package]
name = "chatsh"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "PTY-level, shell-agnostic AI chat tool that lives inline in any terminal"
license = "MIT"
repository = "https://github.com/taquangtrung/chatsh"
readme = "README.md"
keywords = ["cli", "ai", "terminal", "shell", "pty"]
categories = ["command-line-utilities"]
exclude = ["assets/*"]

[dependencies]
anyhow = "1"
async-stream = "0.3"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
futures = "0.3"
keyring = "4.0.1"
keyring-core = "1.0.0"
parking_lot = "0.12"
portable-pty = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "rustls-tls"] }
secrecy = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
tokio = { version = "1", features = ["full"] }
toml = "0.8"
url = "2"
